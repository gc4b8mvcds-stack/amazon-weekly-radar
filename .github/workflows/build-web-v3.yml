name: Validate Web V2

on:
  push:
    branches: [main]
    paths:
      - "data-2.json"
      - "scripts/build_web_v3.py"
      - "scripts/validate_web_data.py"
      - ".github/workflows/build-web-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate manifest and every chunk
        run: |
          python3 -m json.tool data-2.json > /dev/null
          python3 -m json.tool manifest.json > /dev/null
          for chunk in data/chunk-*.json; do
            python3 -m json.tool "$chunk" > /dev/null
          done
