<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon V4.5 机会雷达</title>
<style>
html,body{margin:0;background:#0b1522;color:#eef4fb;font-family:Arial,"Microsoft YaHei",sans-serif;font-size:16px}
.wrap{max-width:1800px;margin:auto;padding:20px}h1{font-size:32px;margin:0 0 8px}.sub{color:#9eb1c4;margin-bottom:4px}.updated{color:#71879b;font-size:14px;margin-bottom:18px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.card,.panel{background:#132234;border:1px solid #263b52;border-radius:10px;padding:14px}
.card{min-width:160px}.label{font-size:15px;color:#9eb1c4}.value{font-size:30px;color:#62d6a7;font-weight:bold;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,input,select{background:#183049;color:#fff;border:1px solid #36546f;border-radius:9px;padding:10px 14px;font-size:15px;transition:all .18s ease}
button{cursor:pointer;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}button:hover{background:#24506f;border-color:#62d6a7;transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.22)}button:active{transform:translateY(0);box-shadow:0 2px 6px rgba(0,0,0,.16)}button.topbtn.active{background:#245a46;border-color:#62d6a7;box-shadow:0 0 0 2px rgba(98,214,167,.10),0 4px 12px rgba(0,0,0,.18)}input:focus,select:focus{outline:none;border-color:#62d6a7;box-shadow:0 0 0 3px rgba(98,214,167,.12)}
input{min-width:280px}.stats{color:#9eb1c4;margin:10px 0}.tablewrap{overflow:auto;max-height:68vh;border:1px solid #263b52;border-radius:8px}table{border-collapse:collapse;width:100%;min-width:1650px;background:#0f1c2b}th,td{padding:11px 13px;border-bottom:1px solid #23384d;white-space:nowrap;font-size:15px}th{position:sticky;top:0;background:#173049;color:#c8d7e5;z-index:3}td:nth-child(2){color:#62d6a7;font-weight:bold}td:nth-child(3){font-weight:bold;font-size:16px}.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}footer{text-align:center;color:#73879a;padding:24px;font-size:14px}
</style></head><body><div class="wrap">
<h1>Amazon Weekly Opportunity Radar · <span id="v">V4.5</span></h1><div class="sub" id="sub">正在加载 data.json...</div><div class="updated" id="updated">更新时间：--</div>
<div class="cards"><div class="card"><div class="label">全部机会</div><div class="value" id="total">-</div></div><div class="card"><div class="label">持续上涨</div><div class="value" id="up">-</div></div><div class="card"><div class="label">品牌搜索词</div><div class="value" id="brand">-</div></div><div class="card"><div class="label">明确季节词</div><div class="value" id="season">-</div></div><div class="card"><div class="label">季节待确认</div><div class="value" id="review">-</div></div></div>
<div class="panel"><div class="toolbar"><button class="topbtn" onclick="setTop(50,this)">TOP50</button><button class="topbtn active" onclick="setTop(100,this)">TOP100</button><button class="topbtn" onclick="setTop(200,this)">TOP200</button><button class="topbtn" onclick="setTop(300,this)">TOP300</button><button class="topbtn" onclick="setTop(999999,this)">全部机会</button><select id="cat" onchange="apply()"><option value="">全部类目</option></select><select id="type" onchange="apply()"><option value="">全部类型</option><option>持续上涨</option><option>优先</option><option>Halloween</option><option>秋季</option><option>Christmas</option><option value="待确认">季节待确认</option><option value="品牌搜索词=是">品牌搜索词</option></select><input id="q" placeholder="搜索关键词 / 品牌 / 季节 / 类目 / 趋势..." oninput="apply()"><select id="size" onchange="pageSize=+this.value;page=1;render()"><option value="50">每页50</option><option value="100" selected>每页100</option><option value="200">每页200</option></select></div><div class="stats" id="stats"></div>
<div class="tablewrap"><table><thead><tr><th>#</th><th>综合评分</th><th>搜索词</th><th>类目</th><th>最新排名</th><th>上周排名</th><th>趋势</th><th>等级</th><th>4周有效上涨</th><th>商品集中度</th><th>品牌集中度</th><th>品牌搜索词</th><th>匹配品牌</th><th>季节类型</th><th>季节置信度</th><th>季节命中依据</th><th>优先级</th><th>风险</th><th>实物适合度</th></tr></thead><tbody id="tb"><tr><td colspan="19">加载中...</td></tr></tbody></table></div><div class="pager"><button onclick="if(page>1){page--;render()}">上一页</button><span id="pi"></span><button onclick="next()">下一页</button></div></div></div><footer>© 2026 飞羽电竞 · All Rights Reserved</footer>
<script>
let all=[],filtered=[],topN=100,page=1,pageSize=100;const E=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const text=x=>[x.keyword,x.category,x.trend,x.level,x.product,x.brand_conc,x.brand_search,x.matched_brand,x.season,x.season_reason,x.priority,x.risk,x.fit].join(" ").toLowerCase();
function setTop(n,btn){topN=n;document.querySelectorAll(".topbtn").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");apply()}
function apply(){const q=document.getElementById("q").value.trim().toLowerCase(),typ=document.getElementById("type").value,cat=document.getElementById("cat").value;filtered=all.filter(x=>{if(x.pos>topN)return false;if(cat&&!String(x.category||"").split(",").map(v=>v.trim()).includes(cat))return false;const t=text(x);if(q&&!t.includes(q))return false;if(typ==="品牌搜索词=是")return x.brand_search==="是";if(typ&&!t.includes(typ.toLowerCase()))return false;return true});page=1;render()}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize));if(page>pages)page=pages;const a=(page-1)*pageSize,b=Math.min(a+pageSize,filtered.length),rows=filtered.slice(a,b);document.getElementById("tb").innerHTML=rows.map(x=>`<tr><td>${E(x.pos)}</td><td>${E(x.score)}</td><td>${E(x.keyword)}</td><td>${E(x.category)}</td><td>${E(x.new_rank)}</td><td>${E(x.old_rank)}</td><td>${E(x.trend)}</td><td>${E(x.level)}</td><td>${E(x.up4)}</td><td>${E(x.product)}</td><td>${E(x.brand_conc)}</td><td>${E(x.brand_search)}</td><td>${E(x.matched_brand)}</td><td>${E(x.season)}</td><td>${E(x.season_conf)}</td><td>${E(x.season_reason)}</td><td>${E(x.priority)}</td><td>${E(x.risk)}</td><td>${E(x.fit)}</td></tr>`).join("")||'<tr><td colspan="19">无数据</td></tr>';document.getElementById("pi").textContent=`第 ${page} / ${pages} 页`;document.getElementById("stats").textContent=`当前筛选：${filtered.length} 条；本页显示 ${filtered.length?a+1:0}-${b} 条`}
function next(){const p=Math.max(1,Math.ceil(filtered.length/pageSize));if(page<p){page++;render()}}
fetch("./data.json").then(r=>r.json()).then(d=>{all=d.records||[];document.getElementById("v").textContent=d.version;document.getElementById("sub").textContent=`${d.date} · GitHub 数据分离版`;const now=new Date();document.getElementById("updated").textContent=`更新时间：${now.toLocaleString("zh-CN",{hour12:false})}`;document.getElementById("total").textContent=d.summary.total.toLocaleString();document.getElementById("up").textContent=d.summary.trend_up.toLocaleString();document.getElementById("brand").textContent=d.summary.brand_yes.toLocaleString();document.getElementById("season").textContent=d.summary.seasonal.toLocaleString();document.getElementById("review").textContent=d.summary.review.toLocaleString();const s=document.getElementById("cat");(d.categories||[]).forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;s.appendChild(o)});apply()}).catch(e=>document.getElementById("tb").innerHTML=`<tr><td colspan="19">data.json 加载失败：${E(e.message)}</td></tr>`);
</script></body></html>
